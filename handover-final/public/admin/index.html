<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aishwarya — Private Studio</title>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&family=Playfair+Display:wght@500;600&display=swap');:root{--g:#273d32;--p:#fffdf9;--c:#f5f0e8;--i:#202018;--l:#ddd5c8;--m:#81776a;--gold:#d7a331}*{box-sizing:border-box}body{margin:0;background:var(--g);color:var(--i);font:14px 'DM Sans',sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(470px,100%);background:var(--p);padding:42px;border-radius:5px;box-shadow:0 25px 80px #0002}.brand{font:500 23px 'Playfair Display';letter-spacing:.13em}.brand small{display:block;font:9px 'DM Mono';letter-spacing:.16em;color:var(--m);margin-top:7px}.ey{font:9px 'DM Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--m)}h1{font:500 38px/1.05 'Playfair Display';margin:30px 0 8px}.sub{color:var(--m);line-height:1.6;margin-bottom:25px}.form{display:grid;gap:14px}.field label{font:9px 'DM Mono';text-transform:uppercase;letter-spacing:.08em;color:var(--m)}input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--l);background:#fffdfa;font:14px 'DM Sans'}button{border:0;background:var(--i);color:white;padding:12px 15px;cursor:pointer;font:12px 'DM Sans';margin-top:4px}.light{background:transparent;color:var(--i);border:1px solid var(--l)}.err{color:#8a392f;font-size:12px;min-height:16px}.step{display:flex;gap:7px;margin:22px 0}.step span{width:8px;height:8px;border-radius:50%;background:var(--l)}.step span.on{background:var(--gold)}.qr{text-align:center;padding:15px;background:#fff;border:1px solid var(--l);margin:10px 0}.qr img{max-width:250px}.codes{background:#f0ebe2;padding:14px;font-family:'DM Mono';font-size:12px;line-height:2}.hidden{display:none}.note{font-size:11px;color:var(--m);line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.box{padding:28px}.row{grid-template-columns:1fr}}
</style></head><body><main class="shell"><section class="box"><div class="brand">AISHWARYA<small>ALMARA · PRIVATE STUDIO</small></div><div id="app"></div></section></main>
<script>
const A='/api',app=document.querySelector('#app');let setupToken='',totpSecret='';
const page=(title,sub,body,step=1)=>{app.innerHTML=`<div class="step"><span class="${step>=1?'on':''}"></span><span class="${step>=2?'on':''}"></span><span class="${step>=3?'on':''}"></span></div><div class="ey">Private studio setup</div><h1>${title}</h1><div class="sub">${sub}</div>${body}`};
function showError(e){document.querySelector('.err').textContent=e.message||e}
async function status(){let r=await fetch(A+'/admin/setup/status');let d=await r.json();return d.ownerExists}
function signup(){page('Create your Private Studio','This one-time setup creates the owner account. Public owner registration closes after this account exists.',`<form class="form" id="sf"><div class="row"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Mobile</label><input name="phone" placeholder="+919494739944" required></div></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="row"><div class="field"><label>Password</label><input name="password" type="password" minlength="12" required></div><div class="field"><label>Confirm password</label><input name="confirmPassword" type="password" minlength="12" required></div></div><div class="field"><label>Private setup key</label><input name="setupKey" type="password" required><div class="note">This is the one-time key stored in your Netlify environment variables. It prevents strangers from claiming the first owner account.</div></div><div class="err"></div><button>Create owner account →</button></form>`);sf.onsubmit=async e=>{e.preventDefault();try{let r=await fetch(A+'/admin/setup/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(sf)))}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not start setup');setupToken=d.setupToken;otp();}catch(x){showError(x)}}}
function otp(){page('Verify your account','We will verify the contact you registered before creating the owner account.',`<form class="form" id="of"><div class="field"><label>Verification code</label><input name="code" inputmode="numeric" maxlength="6" placeholder="6 digits" required></div><div class="err"></div><button>Verify & continue →</button></form><p class="note">The code is delivered by your configured OTP provider. In local development, use the OTP printed in the server log when OTP_PROVIDER=console.</p>`,2);of.onsubmit=async e=>{e.preventDefault();try{let r=await fetch(A+'/admin/setup/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setupToken,code:new FormData(of).get('code')})}),d=await r.json();if(!r.ok)throw Error(d.error||'Verification failed');totp();}catch(x){showError(x)}}}
async function totp(){try{let r=await fetch(A+'/admin/setup/totp',{method:'POST',credentials:'include'}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not create authenticator setup');totpSecret=d.secret;page('Secure it with Google Authenticator','Scan this QR code in Google Authenticator, then enter the current 6-digit code.',`<div class="qr"><img src="${d.qrDataUrl}" alt="Google Authenticator QR code"></div><p class="note">If you cannot scan, use the setup key below in Google Authenticator.</p><div class="codes">${d.secret}</div><form class="form" id="tf"><div class="field"><label>Authenticator code</label><input name="code" inputmode="numeric" maxlength="6" placeholder="6 digits" required></div><div class="err"></div><button>Complete secure setup →</button></form>`,3);tf.onsubmit=async e=>{e.preventDefault();try{let r=await fetch(A+'/admin/setup/complete',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({secret:totpSecret,code:new FormData(tf).get('code')})}),d=await r.json();if(!r.ok)throw Error(d.error||'Authenticator verification failed');done()}catch(x){showError(x)}}}catch(x){app.innerHTML='<p class="err">'+x.message+'</p>'}}
function done(){page('Setup complete','Your owner account and Google Authenticator are now registered.',`<p>Your Private Studio is ready. You can now sign in normally.</p><button onclick="login()">Go to secure sign in →</button><p class="note">Keep your authenticator app on your phone. Never share your authenticator secret or verification codes.</p>`,3)}
function login(){page('Welcome back.','Sign in with your owner/staff credentials and current Google Authenticator code.',`<form class="form" id="lf"><div class="field"><label>Email or phone</label><input name="identifier" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><div class="field"><label>Authenticator code</label><input name="totp" inputmode="numeric" maxlength="6" placeholder="6 digits" required></div><div class="err"></div><button>Enter Private Studio →</button></form>`);lf.onsubmit=async e=>{e.preventDefault();try{let r=await fetch(A+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(Object.fromEntries(new FormData(lf)))}),d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');location.href='/admin/dashboard.html'}catch(x){showError(x)}}}
(async()=>{try{let logged=await fetch(A+'/admin/me',{credentials:'include'});if(logged.ok){location.href='/admin/dashboard.html';return}let exists=await status();exists?login():signup()}catch(e){app.innerHTML='<div class="err">The admin API is not connected yet. Please deploy the backend and database configuration first.</div>'}})();
</script></body></html>
