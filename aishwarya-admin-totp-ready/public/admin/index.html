<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aishwarya — Private Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&family=Playfair+Display:ital,wght@0,500;0,600&display=swap');
:root{--i:#202018;--p:#fffdf9;--c:#f5f0e8;--g:#273d32;--gold:#d7a331;--l:#ddd5c8;--m:#81776a;--red:#8a392f}
*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font:14px 'DM Sans',sans-serif}.login{min-height:100vh;display:grid;place-items:center;background:var(--g);padding:25px}.box{width:min(470px,100%);background:var(--p);padding:42px;border-radius:5px}.brand{font:500 23px 'Playfair Display';letter-spacing:.13em}.brand small{display:block;font:9px 'DM Mono';letter-spacing:.16em;color:#9c927f;margin-top:7px}.box h1{font:500 38px 'Playfair Display';margin:38px 0 8px}.box p{color:var(--m);line-height:1.6}.form{display:grid;gap:14px;margin-top:25px}.form label{font:9px 'DM Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--m)}.form input{display:block;margin-top:6px;width:100%;padding:12px;border:1px solid var(--l);background:#fffdfa}.btn{border:1px solid var(--i);background:var(--i);color:#fff;padding:11px 15px;border-radius:3px;cursor:pointer;font-size:12px}.light{background:transparent;color:var(--i);border-color:var(--l)}.err{color:var(--red);font-size:12px;min-height:16px}.setup{text-align:center}.setup img{width:220px;height:220px;background:white;padding:8px;margin:15px auto;border:1px solid var(--l)}.secret{font:12px 'DM Mono';word-break:break-all;background:#f1ece3;padding:10px;border-radius:3px}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:var(--g);color:#f8f3e8;padding:30px 20px;display:flex;flex-direction:column}.side .brand{color:#fff}.nav{margin-top:42px;display:grid;gap:4px}.nav button{border:0;background:0;color:#dcd7ca;text-align:left;padding:12px;border-radius:7px;cursor:pointer}.nav button:hover,.nav .on{background:#ffffff12;color:#fff}.nav .on:before{content:'•';color:var(--gold);margin-right:8px}.foot{margin-top:auto;color:#aeb8ad;font-size:11px;line-height:1.6}.main{padding:34px 42px;min-width:0}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.ey{font:10px 'DM Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--m)}h1{font:500 42px/1 'Playfair Display';margin:7px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--p);border:1px solid var(--l);border-radius:4px}.card{padding:20px}.num{font:500 29px 'Playfair Display';margin-top:8px}.hint{font-size:11px;color:var(--m);margin-top:7px}.panel{padding:22px;margin-top:16px}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel h2{font:500 24px 'Playfair Display';margin:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--l);text-align:left;font-size:12px}.table th{font:9px 'DM Mono';text-transform:uppercase;color:var(--m)}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#ece7dd;font:9px 'DM Mono';text-transform:uppercase}.ok{background:#e0ebe3;color:#31513f}.bad{background:#f2dfdb;color:#81392f}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{background:var(--p);border:1px solid var(--l);overflow:hidden}.product img{width:100%;height:230px;object-fit:cover}.pi{padding:15px}.pi h3{font:500 19px 'Playfair Display';margin:5px 0}.pa{display:flex;gap:7px;margin-top:12px}.pa button{flex:1}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{padding:18px 20px}.nav{display:flex;overflow:auto;margin-top:18px}.nav button{white-space:nowrap}.foot{display:none}.main{padding:24px 18px}.cards{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr 1fr}}@media(max-width:560px){.cards,.products{grid-template-columns:1fr}.main{padding:20px 14px}.top{align-items:flex-start;flex-direction:column;gap:15px}.box{padding:28px}}
</style></head><body><div id="root"></div><script>
const A='/api',R=document.querySelector('#root');let V='overview',ME=null;
async function api(p,o={}){let r=await fetch(A+p,{credentials:'include',headers:{'Content-Type':'application/json',...(o.headers||{})},...o});let d=r.status===204?null:await r.json();if(!r.ok)throw Error(d?.error||'Request failed');return d}
function login(msg=''){R.innerHTML=`<main class="login"><section class="box"><div class="brand">AISHWARYA<small>ALMARA · PRIVATE STUDIO</small></div><h1>Welcome back.</h1><p>Secure access for the owner and authorised staff.</p><form class="form" id="lf"><div><label>Email or phone</label><input name="identifier" required></div><div><label>Password</label><input name="password" type="password" required></div><div><label>Google Authenticator code</label><input name="totp" maxlength="6" inputmode="numeric" placeholder="6-digit code"></div><div class="err">${msg}</div><button class="btn">Enter Private Studio →</button></form></section></main>`;lf.onsubmit=async e=>{e.preventDefault();try{let d=await api('/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(lf)))});ME=d;if((d.role==='owner'||d.role==='staff')&&!d.totpConfigured)setup()}catch(x){login(x.message)}}}
async function setup(){try{let d=await api('/admin/totp/setup');R.innerHTML=`<main class="login"><section class="box setup"><div class="brand">AISHWARYA<small>ALMARA · PRIVATE STUDIO</small></div><h1>Secure your account.</h1><p>Scan this QR code with <b>Google Authenticator</b>. It will generate a new 6-digit code every 30 seconds.</p><img src="${d.qrDataUrl}" alt="Authenticator QR code"><p>Can't scan? Enter this setup key manually:</p><div class="secret">${d.secret}</div><form class="form" id="sf"><div><label>Current 6-digit code</label><input name="code" maxlength="6" inputmode="numeric" required></div><div class="err" id="se"></div><button class="btn">Verify & secure account →</button></form></section></main>`;sf.onsubmit=async e=>{e.preventDefault();try{await api('/admin/totp/verify',{method:'POST',body:JSON.stringify({secret:d.secret,code:new FormData(sf).get('code')})});app()}catch(x){se.textContent=x.message}}}catch(x){login(x.message)}}
function app(){R.innerHTML=`<div class="app"><aside class="side"><div class="brand">AISHWARYA<small>ALMARA · PRIVATE STUDIO</small></div><nav class="nav">${[['overview','Overview'],['orders','Orders'],['products','Sarees'],['analytics','Analytics'],['staff','Staff & access']].map(x=>`<button class="${V==x[0]?'on':''}" data-v="${x[0]}">${x[1]}</button>`).join('')}</nav><div class="foot">Owner & staff workspace<br>Privileged changes are recorded.</div></aside><main class="main"><div class="top"><div><div class="ey">Private studio</div><h1>${V[0].toUpperCase()+V.slice(1)}</h1></div><div><button class="btn light" id="store">View store ↗</button> <button class="btn" id="out">Sign out</button></div></div><section id="c"></section></main></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{V=b.dataset.v;app()});out.onclick=async()=>{await fetch(A+'/auth/logout',{method:'POST',credentials:'include'});login()};store.onclick=()=>location.href='/';render()}
async function render(){let c=document.querySelector('#c');try{if(V==='overview'){let d=await api('/admin/overview');c.innerHTML=`<div class="cards">${[['Revenue','₹'+Number(d.revenue).toLocaleString('en-IN'),'Paid orders'],['Orders',d.orders,'All orders'],['Customers',d.customers,'Registered'],['Sarees',d.activeProducts,'Active catalogue']].map(x=>`<div class="card"><div class="ey">${x[0]}</div><div class="num">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('')}</div><div class="panel"><div class="ph"><h2>Store pulse</h2><span class="pill ok">Live</span></div><p>Tracked events in the last 30 days: <b>${d.events30d}</b>.</p></div>`}else if(V==='orders'){let a=await api('/admin/orders');c.innerHTML=`<div class="panel"><div class="ph"><h2>Orders</h2><span class="pill">${a.length} shown</span></div><div class="tablewrap"><table class="table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Delhivery</th></tr>${a.map(o=>`<tr><td>${o.order_number}</td><td>${o.customer_name||'Guest'}</td><td>₹${Number(o.total_inr).toLocaleString('en-IN')}</td><td>${o.payment_status}</td><td>${o.status}</td><td>${o.delhivery_awb||'—'}</td></tr>`).join('')}</table></div></div>`}else if(V==='products'){let a=await api('/products');c.innerHTML=`<div class="panel"><div class="ph"><h2>Saree catalogue</h2><button class="btn" onclick="alert('Next: connect product form to image storage, categories, price and stock.')">+ Add saree</button></div><div class="products">${a.map(p=>`<article class="product"><img src="${p.image_url}" alt=""><div class="pi"><div class="ey">${p.category||'Uncategorised'}</div><h3>${p.name}</h3><div>₹${Number(p.price_inr).toLocaleString('en-IN')} · ${p.stock} in stock</div><p><span class="pill ${p.status==='active'?'ok':'bad'}">${p.status.replace('_',' ')}</span></p><div class="pa"><button class="btn light" onclick="alert('Edit ${p.name} — form coming next.')">Edit</button><button class="btn" onclick="toggleP('${p.id}','${p.status}')">${p.status==='active'?'Out of stock':'Make active'}</button></div></div></article>`).join('')}</div></div>`}else if(V==='analytics'){let a=await api('/admin/analytics');c.innerHTML=`<div class="panel"><div class="ph"><h2>Analytics</h2><span class="pill ok">30 days</span></div><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Event</th><th>Count</th></tr>${a.map(x=>`<tr><td>${x.day}</td><td>${x.event_name}</td><td>${x.count}</td></tr>`).join('')}</table></div></div>`}else{let a=await api('/admin/staff');c.innerHTML=`<div class="panel"><div class="ph"><h2>Staff & access</h2>${ME?.role==='owner'?'<button class="btn" onclick="alert(\\'Staff creation form will be added next.\\')">+ Add staff</button>':''}</div><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Authenticator</th><th>Status</th></tr>${a.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.role}</td><td>${x.totp_configured?'Configured':'Not configured'}</td><td>${x.is_active?'Active':'Disabled'}</td></tr>`).join('')}</table></div></div>`}}catch(e){c.innerHTML=`<div class="panel"><h2>Something needs attention</h2><p>${e.message}</p></div>`}}
async function toggleP(id,status){await api('/admin/products/'+id,{method:'PATCH',body:JSON.stringify({status:status==='active'?'out_of_stock':'active'})});render()}
api('/admin/me').then(d=>{ME=d;if(!d.totpConfigured)setup();else app()}).catch(()=>login());
</script></body></html>
